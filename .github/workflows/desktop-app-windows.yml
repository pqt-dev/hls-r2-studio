name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "desktop-app/**"

permissions:
  contents: read

concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop-app
    env:
      FFMPEG_CACHE_DIR: ${{ github.workspace }}/.ffmpeg-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG_NAME" != "desktop-v${version}" ]; then
            echo "Tag '$TAG_NAME' does not match desktop-v${version} (version in desktop-app/package.json)" >&2
            exit 1
          fi

      # The site URL is baked into the app at build time (HLS_SITE_URL, a repository variable).
      # Tag and manual builds produce an installer, so they must have it. Pull requests do not
      # build the installer and forks cannot read variables: they use a safe placeholder.
      - name: Check HLS_SITE_URL is configured
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HLS_SITE_URL: ${{ vars.HLS_SITE_URL }}
        run: |
          if [ -z "$HLS_SITE_URL" ]; then
            echo "The repository variable HLS_SITE_URL is empty. Set it under Settings > Secrets and variables > Actions > Variables (for example https://admin.example.com) and run the build again." >&2
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Cache ffmpeg download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ffmpeg-cache
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('desktop-app/ffmpeg.lock.json') }}

      - name: Fetch pinned ffmpeg (SHA-256 verified)
        run: npm run fetch:ffmpeg

      - name: Point integration tests at the bundled ffmpeg
        shell: bash
        run: |
          echo "FFMPEG_PATH=$GITHUB_WORKSPACE/desktop-app/resources/bin/ffmpeg.exe" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=$GITHUB_WORKSPACE/desktop-app/resources/bin/ffprobe.exe" >> "$GITHUB_ENV"

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Everything below builds the installer: not on pull requests.
      - name: Generate third-party notices
        if: github.event_name != 'pull_request'
        run: npm run gen:notices

      - name: Build app
        if: github.event_name != 'pull_request'
        env:
          # Placeholder only for pull requests (forks cannot read variables). This step is skipped on
          # pull requests today; the fallback keeps it working if that ever changes.
          HLS_SITE_URL: ${{ github.event_name == 'pull_request' && 'https://example.invalid' || vars.HLS_SITE_URL }}
        run: npm run build

      - name: Package unpacked app (config check)
        if: github.event_name != 'pull_request'
        run: npx electron-builder --win --dir --x64

      - name: List unpacked tree
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -d release/win-unpacked ]; then
            (cd release/win-unpacked && find . -type f -printf '%s %p\n' | sort -k2) > unpacked-listing.txt
          else
            echo "release/win-unpacked was not produced" > unpacked-listing.txt
          fi
          cat unpacked-listing.txt | head -80

      - name: Upload unpacked listing
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unpacked-listing-${{ github.sha }}
          path: desktop-app/unpacked-listing.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Build NSIS installer
        if: github.event_name != 'pull_request'
        run: npx electron-builder --win nsis --x64

      - name: Verify installer and bundled files
        if: github.event_name != 'pull_request'
        run: node scripts/verify-dist.mjs

      - name: Upload installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hls-r2-studio-windows-${{ github.sha }}
          path: |
            desktop-app/release/HLS-R2-Studio-Setup-*.exe
            desktop-app/release/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hls-r2-studio-windows-${{ github.sha }}
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --draft --title "$TAG" --notes "Unsigned Windows installer. See desktop-app/docs/PACKAGING.md for SmartScreen and verification notes."
