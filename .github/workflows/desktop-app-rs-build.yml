name: Desktop app Rust (Windows installer)

# Manual build of the unsigned NSIS installer of the Tauri app (desktop-app-rs). The installer is
# uploaded as a workflow artifact; nothing is published or released.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-app-rs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop-app-rs
    env:
      # Where the NSIS installer and SHA256SUMS.txt end up (relative to desktop-app-rs).
      NSIS_DIR: src-tauri/target/release/bundle/nsis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The site URL is baked into the app at build time (HLS_SITE_URL, a plain repository
      # variable, not a secret). build.rs also refuses a release build without a valid https URL.
      - name: Check HLS_SITE_URL is configured
        shell: bash
        env:
          HLS_SITE_URL: ${{ vars.HLS_SITE_URL }}
        run: |
          if [ -z "$HLS_SITE_URL" ]; then
            echo "The repository variable HLS_SITE_URL is empty. Set it under Settings > Secrets and variables > Actions > Variables (for example https://admin.example.com) and run the build again." >&2
            exit 1
          fi
          case "$HLS_SITE_URL" in
            https://*) ;;
            *)
              echo "The repository variable HLS_SITE_URL must start with https:// (got a different scheme). Fix it under Settings > Secrets and variables > Actions > Variables and run the build again." >&2
              exit 1
              ;;
          esac

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop-app-rs/package-lock.json

      - run: npm ci --ignore-scripts

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop-app-rs/src-tauri

      - name: Cache ffmpeg download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: desktop-app-rs/.ffmpeg-cache
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('desktop-app-rs/ffmpeg.lock.json') }}

      # Downloads the pinned archive (ffmpeg.lock.json), verifies its SHA-256 BEFORE opening it,
      # extracts ONLY ffmpeg.exe and ffprobe.exe into src-tauri/resources/bin and verifies each
      # against the per-file hash of the lock. Any mismatch fails the build. Nothing downloaded is
      # executed here.
      - name: Fetch pinned ffmpeg (SHA-256 verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          function Get-Sha256([string]$Path) {
            return (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
          }

          $lock = Get-Content -Raw -LiteralPath 'ffmpeg.lock.json' | ConvertFrom-Json
          if ($lock.url -notmatch '^https://') { throw 'ffmpeg.lock.json: url must be https' }
          if ($lock.sha256 -notmatch '^[0-9a-f]{64}$') { throw 'ffmpeg.lock.json: sha256 is malformed' }

          $cacheDir = Join-Path $PWD '.ffmpeg-cache'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          $zip = Join-Path $cacheDir "$($lock.sha256).zip"

          if ((Test-Path -LiteralPath $zip) -and ((Get-Sha256 $zip) -ne $lock.sha256)) {
            Write-Host 'Cached archive is corrupt, downloading again'
            Remove-Item -Force -LiteralPath $zip
          }
          if (-not (Test-Path -LiteralPath $zip)) {
            Write-Host "Downloading $($lock.url)"
            Invoke-WebRequest -Uri $lock.url -OutFile "$zip.part"
            Move-Item -Force -LiteralPath "$zip.part" -Destination $zip
          }
          $actual = Get-Sha256 $zip
          if ($actual -ne $lock.sha256) {
            Remove-Item -Force -LiteralPath $zip
            throw "SHA-256 mismatch for the ffmpeg archive`n  expected $($lock.sha256)`n  actual   $actual"
          }
          Write-Host 'ffmpeg archive SHA-256 verified'

          $binDir = Join-Path $PWD 'src-tauri/resources/bin'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($f in ($lock.files | Where-Object { $_.kind -eq 'binary' })) {
              if ($f.dest -ne (Split-Path -Leaf $f.dest)) { throw "lock dest must be a plain file name: $($f.dest)" }
              $entryName = "$($lock.archiveRoot)/$($f.entry)"
              $entry = $archive.GetEntry($entryName)
              if ($null -eq $entry) { throw "archive does not contain the expected entry $entryName" }

              $dest = Join-Path $binDir $f.dest
              $tmp = "$dest.tmp"
              $in = $entry.Open()
              try {
                $out = [System.IO.File]::Create($tmp)
                try { $in.CopyTo($out) } finally { $out.Dispose() }
              } finally { $in.Dispose() }

              if ((Get-Sha256 $tmp) -ne $f.sha256) {
                Remove-Item -Force -LiteralPath $tmp
                throw "SHA-256 mismatch for extracted $entryName"
              }
              Move-Item -Force -LiteralPath $tmp -Destination $dest
              Write-Host "Installed $($f.dest)"
            }
          } finally { $archive.Dispose() }

          # The ffmpeg license texts are committed under LICENSES/ffmpeg; they must match the lock.
          foreach ($f in ($lock.files | Where-Object { $_.kind -eq 'license' })) {
            $path = Join-Path 'LICENSES/ffmpeg' $f.dest
            if (-not (Test-Path -LiteralPath $path)) { throw "missing license file $path" }
            if ((Get-Sha256 $path) -ne $f.sha256) { throw "SHA-256 mismatch for $path (does not match ffmpeg.lock.json)" }
          }
          Write-Host 'ffmpeg license files match the lock'

      - name: Generate third-party notices
        run: node scripts/gen-notices.mjs

      # `npx tauri build` runs `npm run build:web` first (beforeBuildCommand). The bundle config
      # adds the resources (ffmpeg, licenses); it is kept out of tauri.conf.json so that dev
      # builds and cargo test work without the downloaded files.
      - name: Build NSIS installer
        env:
          HLS_SITE_URL: ${{ vars.HLS_SITE_URL }}
        run: npx tauri build --bundles nsis --config src-tauri/tauri.bundle.conf.json

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath $env:NSIS_DIR -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer in $env:NSIS_DIR, found $($installers.Count): $($installers.Name -join ', ')"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installers[0].FullName).Hash.ToLowerInvariant()
          # sha256sum format ("<hash>  <file>"), no BOM.
          [System.IO.File]::WriteAllText(
            (Join-Path (Resolve-Path $env:NSIS_DIR) 'SHA256SUMS.txt'),
            "$hash  $($installers[0].Name)`n")

      # Silent install into a temp dir, check the installed files, run the bundled ffmpeg, then
      # silent uninstall. NSIS needs /D= as the LAST argument, unquoted. On Windows Tauri installs
      # resources next to the executable (resource_dir() is the executable folder), so the layout is
      # <dir>\bin\ffmpeg.exe and <dir>\LICENSES\THIRD-PARTY-NOTICES.txt.
      - name: Smoke test (install, run ffmpeg, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-File([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              Write-Host 'Install folder content:'
              Get-ChildItem -Recurse -LiteralPath $dir | ForEach-Object { Write-Host $_.FullName }
              throw "missing file after install: $Path"
            }
            Write-Host "ok: $Path"
          }

          $installers = @(Get-ChildItem -LiteralPath $env:NSIS_DIR -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer in $env:NSIS_DIR, found $($installers.Count)"
          }
          $installer = $installers[0].FullName
          $lock = Get-Content -Raw -LiteralPath 'ffmpeg.lock.json' | ConvertFrom-Json

          $dir = Join-Path $env:RUNNER_TEMP 'hls-r2-studio-smoke'
          if (Test-Path -LiteralPath $dir) { Remove-Item -Recurse -Force -LiteralPath $dir }

          Write-Host "Installing $installer into $dir"
          $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with code $($p.ExitCode)" }

          Assert-File (Join-Path $dir 'hls-r2-studio.exe')
          Assert-File (Join-Path $dir 'uninstall.exe')
          Assert-File (Join-Path $dir 'bin/ffmpeg.exe')
          Assert-File (Join-Path $dir 'bin/ffprobe.exe')
          Assert-File (Join-Path $dir 'LICENSES/THIRD-PARTY-NOTICES.txt')
          Assert-File (Join-Path $dir 'LICENSES/ffmpeg/LICENSE-GPL-3.0.txt')
          Assert-File (Join-Path $dir 'LICENSES/ffmpeg/README-gyan-build.txt')

          # The installed binaries are the pinned ones.
          foreach ($f in ($lock.files | Where-Object { $_.kind -eq 'binary' })) {
            $installed = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dir "bin/$($f.dest)")).Hash.ToLowerInvariant()
            if ($installed -ne $f.sha256) { throw "installed $($f.dest) does not match the pinned SHA-256" }
          }

          foreach ($tool in 'ffmpeg.exe', 'ffprobe.exe') {
            $lines = @(& (Join-Path $dir "bin/$tool") -version)
            if ($LASTEXITCODE -ne 0) { throw "$tool -version exited with code $LASTEXITCODE" }
            if (-not ($lines[0] -match '^(ffmpeg|ffprobe) version')) { throw "unexpected $tool -version output: $($lines[0])" }
            Write-Host $lines[0]
          }

          # `_?=` keeps the uninstaller running in place (it does not copy itself to %TEMP% and
          # return at once), so -Wait really waits. It must be the last argument, unquoted.
          Write-Host 'Uninstalling'
          $u = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with code $($u.ExitCode)" }

          foreach ($rel in 'hls-r2-studio.exe', 'bin/ffmpeg.exe', 'bin/ffprobe.exe', 'LICENSES/THIRD-PARTY-NOTICES.txt') {
            if (Test-Path -LiteralPath (Join-Path $dir $rel)) { throw "file still present after uninstall: $rel" }
          }
          Write-Host 'Uninstall removed the application files'

          # Only the uninstaller itself may remain (it cannot delete itself while `_?=` is used).
          if (Test-Path -LiteralPath $dir) { Remove-Item -Recurse -Force -LiteralPath $dir }

      - name: Job summary
        shell: pwsh
        env:
          HLS_SITE_URL: ${{ vars.HLS_SITE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem -LiteralPath $env:NSIS_DIR -Filter '*.exe' -File)[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          $mb = [math]::Round($installer.Length / 1MB, 1)
          @(
            '## Windows installer (unsigned)',
            '',
            '| | |',
            '| --- | --- |',
            "| Installer | ``$($installer.Name)`` |",
            "| Size | $mb MB ($($installer.Length) bytes) |",
            "| SHA-256 | ``$hash`` |",
            "| Site URL baked in | ``$env:HLS_SITE_URL`` |",
            "| Commit | ``$env:GITHUB_SHA`` |"
          ) | Add-Content -Encoding utf8 -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hls-r2-studio-rs-windows-${{ github.sha }}
          path: |
            desktop-app-rs/src-tauri/target/release/bundle/nsis/*.exe
            desktop-app-rs/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

      # ---- Launch smoke test -------------------------------------------------------------------
      # Installs the installer again into a fresh folder, STARTS the app, and checks that the
      # window and the webview came up and that the Rust <-> UI IPC answers. The screenshot, the
      # app log and the cleanup run even when this step fails (if: always()); this step leaves
      # the app running on purpose so the screenshot step can still see the window.
      #
      # SECURITY: the remote debugging port below is a CI-only inspection hook. It is set only in
      # the environment of this one step (never baked into the app, never set globally), it binds
      # to 127.0.0.1 and the runner is ephemeral. It must NEVER be enabled in the shipped app.
      - name: Launch smoke test (start the app, check window, webview and IPC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $dir = Join-Path $env:RUNNER_TEMP 'hls-r2-launch-smoke'
          # userData = <config dir>\HLS R2 Studio (state.rs), logs in its logs\ folder.
          $logsDir = Join-Path $env:APPDATA 'HLS R2 Studio\logs'
          $failures = New-Object System.Collections.Generic.List[string]
          $info = [ordered]@{ url = ''; title = ''; windowTitle = ''; version = ''; auth = ''; text = '' }
          $proc = $null

          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class HlsWin {
            private delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] private static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] private static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            public static List<string> List() {
              var res = new List<string>();
              EnumWindows(delegate (IntPtr h, IntPtr l) {
                if (IsWindowVisible(h)) {
                  var sb = new StringBuilder(512);
                  GetWindowText(h, sb, sb.Capacity);
                  uint pid; GetWindowThreadProcessId(h, out pid);
                  res.Add("pid=" + pid + " title=[" + sb.ToString() + "]");
                }
                return true;
              }, IntPtr.Zero);
              return res;
            }
          }
          '@

          function Show-AppLog {
            Write-Host "---- app log ($logsDir) ----"
            $files = @()
            if (Test-Path -LiteralPath $logsDir) { $files = @(Get-ChildItem -LiteralPath $logsDir -Filter 'app.log*' -File) }
            if ($files.Count -eq 0) { Write-Host '(no app.log found)' }
            foreach ($f in $files) {
              Write-Host "== $($f.Name) (last 200 lines)"
              Get-Content -LiteralPath $f.FullName -Tail 200 | ForEach-Object { Write-Host $_ }
            }
            Write-Host '---- end of app log ----'
          }

          function Show-Windows {
            Write-Host '---- visible top-level windows (a native error dialog would show up here) ----'
            foreach ($w in [HlsWin]::List()) { Write-Host $w }
            Write-Host '---- end of windows ----'
          }

          # One Runtime.evaluate over the DevTools websocket; returns the string value.
          function Invoke-Cdp([string]$WsUrl, [string]$Expression) {
            $ws = New-Object System.Net.WebSockets.ClientWebSocket
            $cts = New-Object System.Threading.CancellationTokenSource
            $cts.CancelAfter(20000)
            try {
              $ws.ConnectAsync([Uri]$WsUrl, $cts.Token).GetAwaiter().GetResult()
              $payload = @{
                id     = 1
                method = 'Runtime.evaluate'
                params = @{ expression = $Expression; returnByValue = $true; awaitPromise = $true }
              } | ConvertTo-Json -Depth 5 -Compress
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
              $ws.SendAsync([ArraySegment[byte]]::new($bytes), [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $cts.Token).GetAwaiter().GetResult()

              $buf = New-Object byte[] 65536
              $seg = [ArraySegment[byte]]::new($buf)
              $msg = $null
              while ($true) {
                $ms = New-Object System.IO.MemoryStream
                do {
                  $r = $ws.ReceiveAsync($seg, $cts.Token).GetAwaiter().GetResult()
                  if ($r.MessageType -eq [System.Net.WebSockets.WebSocketMessageType]::Close) { throw 'DevTools websocket was closed' }
                  $ms.Write($buf, 0, $r.Count)
                } while (-not $r.EndOfMessage)
                $msg = [System.Text.Encoding]::UTF8.GetString($ms.ToArray()) | ConvertFrom-Json
                if ($msg.id -eq 1) { break }
              }
              if ($msg.error) { throw "DevTools error: $($msg.error.message)" }
              if ($msg.result.exceptionDetails) { throw "JavaScript exception: $($msg.result.exceptionDetails.text)" }
              return $msg.result.result.value
            } finally {
              $ws.Dispose()
              $cts.Dispose()
            }
          }

          $jsProbe = @'
          (async () => {
            const r = {};
            r.href = location.href;
            r.title = document.title;
            r.apiType = typeof window.hlsApi;
            try { r.version = await window.hlsApi.app.getVersion(); } catch (e) { r.versionError = String((e && e.message) || e); }
            try { r.auth = await window.hlsApi.auth.getState(); } catch (e) { r.authError = String((e && e.message) || e); }
            r.text = (document.body ? document.body.innerText : '').trim().slice(0, 500);
            return JSON.stringify(r);
          })()
          '@

          try {
            $installers = @(Get-ChildItem -LiteralPath $env:NSIS_DIR -Filter '*.exe' -File)
            if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer in $env:NSIS_DIR, found $($installers.Count)" }
            $conf = Get-Content -Raw -LiteralPath 'src-tauri/tauri.conf.json' | ConvertFrom-Json
            $expectedVersion = [string]$conf.version

            if (Test-Path -LiteralPath $dir) { Remove-Item -Recurse -Force -LiteralPath $dir }
            if (Test-Path -LiteralPath $logsDir) { Remove-Item -Recurse -Force -LiteralPath $logsDir }

            # NSIS needs /D= as the LAST argument, unquoted.
            Write-Host "Installing $($installers[0].FullName) into $dir"
            $p = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "installer exited with code $($p.ExitCode)" }
            $exe = Join-Path $dir 'hls-r2-studio.exe'
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "missing file after install: $exe" }

            # Process-local only: the variable is removed again right after the app has started.
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222 --remote-allow-origins=*'
            try {
              Write-Host "Starting $exe"
              $proc = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru
            } finally {
              Remove-Item -Path Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -ErrorAction SilentlyContinue
            }

            # Wait up to 60 s for (a) the main window and (b) the webview page target.
            $windowOk = $false
            $target = $null
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and -not ($windowOk -and $target)) {
              if ($proc.HasExited) { break }
              $proc.Refresh()
              if (-not $windowOk -and $proc.MainWindowHandle -ne [IntPtr]::Zero) {
                $windowOk = $true
                $info.windowTitle = $proc.MainWindowTitle
              }
              if (-not $target) {
                try {
                  $targets = @(Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json' -TimeoutSec 3)
                  $target = $targets | Where-Object { $_.type -eq 'page' -and $_.url -match '^https?://tauri\.localhost(/|$)' -and $_.title } | Select-Object -First 1
                } catch { }
              }
              Start-Sleep -Seconds 1
            }

            if ($proc.HasExited) {
              Show-Windows
              Show-AppLog
              throw "the app exited early with code $($proc.ExitCode)"
            }

            if (-not $windowOk) {
              $failures.Add('no main window handle within 60 s')
            } elseif ($info.windowTitle -ne 'HLS R2 Studio') {
              $failures.Add("unexpected window title [$($info.windowTitle)], expected [HLS R2 Studio]")
            } else {
              Write-Host "ok: main window found, title [$($info.windowTitle)]"
            }

            if (-not $target) {
              $failures.Add('no webview page target on http(s)://tauri.localhost with a title within 60 s')
              try { Write-Host 'DevTools /json said:'; (Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json' -TimeoutSec 3) | ConvertTo-Json -Depth 4 | Write-Host } catch { Write-Host "DevTools /json not reachable: $($_.Exception.Message)" }
            } else {
              $info.url = [string]$target.url
              $info.title = [string]$target.title
              Write-Host "ok: webview page $($info.url) title [$($info.title)]"

              # The UI may still be rendering: retry up to 30 s until the page has some text.
              $res = $null
              $lastError = ''
              $cdpDeadline = (Get-Date).AddSeconds(30)
              do {
                try {
                  $res = (Invoke-Cdp $target.webSocketDebuggerUrl $jsProbe) | ConvertFrom-Json
                  if ($res.text) { break }
                } catch {
                  $lastError = $_.Exception.Message
                  $res = $null
                }
                Start-Sleep -Seconds 1
              } while ((Get-Date) -lt $cdpDeadline)

              if ($null -eq $res) {
                $failures.Add("could not evaluate JavaScript over DevTools: $lastError")
              } else {
                if ($res.apiType -ne 'object') { $failures.Add("typeof window.hlsApi is [$($res.apiType)], expected [object]") }
                else { Write-Host 'ok: window.hlsApi is an object' }

                $info.version = [string]$res.version
                if ($res.versionError) { $failures.Add("hlsApi.app.getVersion() failed: $($res.versionError)") }
                elseif ($info.version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.+-]+)?$') { $failures.Add("app version [$($info.version)] is not semver-like") }
                elseif ($info.version -ne $expectedVersion) { $failures.Add("app version [$($info.version)] differs from tauri.conf.json [$expectedVersion]") }
                else { Write-Host "ok: app version $($info.version)" }

                if ($res.authError) { $failures.Add("hlsApi.auth.getState() failed: $($res.authError)") }
                else {
                  $info.auth = ($res.auth | ConvertTo-Json -Compress -Depth 5)
                  if ($res.auth.status -ne 'signed_out') { $failures.Add("auth state is $($info.auth), expected status signed_out") }
                  else { Write-Host "ok: auth state $($info.auth)" }
                }

                $info.text = [string]$res.text
                if ([string]::IsNullOrWhiteSpace($info.text)) { $failures.Add('document.body.innerText is empty (blank page)') }
                else { Write-Host '---- page text (first 500 chars) ----'; Write-Host $info.text; Write-Host '---- end of page text ----' }
              }
            }

            if ($failures.Count -gt 0) {
              Show-Windows
              Show-AppLog
            }
          } catch {
            $failures.Add($_.Exception.Message)
          } finally {
            # Job summary, written whatever happened above.
            $fence = '`' * 3
            $lines = @(
              '## Launch smoke test',
              '',
              '| | |',
              '| --- | --- |',
              "| Result | $(if ($failures.Count -eq 0) { 'passed' } else { 'FAILED' }) |",
              "| Page URL | ``$($info.url)`` |",
              "| Page title | ``$($info.title)`` |",
              "| Window title | ``$($info.windowTitle)`` |",
              "| App version | ``$($info.version)`` |",
              "| Auth state | ``$($info.auth)`` |",
              ''
            )
            if ($failures.Count -gt 0) {
              $lines += 'Failures:'
              $lines += ''
              foreach ($f in $failures) { $lines += "- $($f -replace '[\r\n]+', ' ')" }
              $lines += ''
            }
            $lines += 'First lines of `document.body.innerText`:'
            $lines += ''
            $lines += $fence
            $lines += (@(($info.text -replace '```', "'''") -split "\r?\n" | Select-Object -First 20))
            $lines += $fence
            $lines += ''
            $lines += 'The screenshot (`screenshot.png`, `window.png`) and the app log are in the artifact `launch-smoke-<commit sha>`.'
            $lines | Add-Content -Encoding utf8 -Path $env:GITHUB_STEP_SUMMARY
          }

          if ($failures.Count -gt 0) {
            foreach ($f in $failures) { Write-Host "::error::$($f -replace '[\r\n]+', ' ')" }
            throw "launch smoke test failed ($($failures.Count) problem(s))"
          }
          Write-Host 'Launch smoke test passed'

      # Screenshot of the whole screen and of the app window. A failed capture only warns.
      - name: Launch smoke test screenshot
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'launch-smoke'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class HlsRect {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
          }
          '@
          try {
            Start-Sleep -Seconds 3

            $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = [System.Drawing.Bitmap]::new($vs.Width, $vs.Height)
            try {
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              try { $g.CopyFromScreen($vs.Left, $vs.Top, 0, 0, $bmp.Size) } finally { $g.Dispose() }
              $bmp.Save((Join-Path $out 'screenshot.png'), [System.Drawing.Imaging.ImageFormat]::Png)
              Write-Host "Saved screenshot.png ($($vs.Width)x$($vs.Height))"

              # Optional: crop of the app window.
              try {
                $app = Get-Process -Name 'hls-r2-studio' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } | Select-Object -First 1
                if ($app) {
                  $rc = New-Object HlsRect+RECT
                  if ([HlsRect]::GetWindowRect($app.MainWindowHandle, [ref]$rc)) {
                    $x = [Math]::Max(0, $rc.Left - $vs.Left)
                    $y = [Math]::Max(0, $rc.Top - $vs.Top)
                    $w = [Math]::Min($bmp.Width - $x, $rc.Right - $rc.Left)
                    $h = [Math]::Min($bmp.Height - $y, $rc.Bottom - $rc.Top)
                    if ($w -gt 0 -and $h -gt 0) {
                      $crop = $bmp.Clone([System.Drawing.Rectangle]::new($x, $y, $w, $h), $bmp.PixelFormat)
                      try { $crop.Save((Join-Path $out 'window.png'), [System.Drawing.Imaging.ImageFormat]::Png) } finally { $crop.Dispose() }
                      Write-Host "Saved window.png (${w}x${h})"
                    }
                  }
                } else {
                  Write-Host 'App is not running (or has no window): only the full screenshot was taken'
                }
              } catch {
                Write-Host "::warning::Window crop failed: $($_.Exception.Message -replace '[\r\n]+', ' ')"
              }
            } finally {
              $bmp.Dispose()
            }
          } catch {
            Write-Host "::warning::Screenshot failed: $($_.Exception.Message -replace '[\r\n]+', ' ')"
          }
          exit 0

      # Only app.log* (already redacted by the app's logger). Nothing else from the user data
      # folder (no token file, no store file).
      - name: Collect app log
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'launch-smoke'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $logsDir = Join-Path $env:APPDATA 'HLS R2 Studio\logs'
          if (-not (Test-Path -LiteralPath $logsDir)) {
            Write-Host "::warning::No logs folder at $logsDir"
            exit 0
          }
          foreach ($f in @(Get-ChildItem -LiteralPath $logsDir -Filter 'app.log*' -File)) {
            try {
              Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $out $f.Name) -Force
              Write-Host "Collected $($f.Name)"
            } catch {
              Write-Host "::warning::Could not copy $($f.Name): $($_.Exception.Message -replace '[\r\n]+', ' ')"
            }
          }
          exit 0

      # Stop the app (and the webview processes it started), uninstall silently, remove the temp
      # folder. This cannot hide a failed assertion: the launch step has already failed by then.
      - name: Launch smoke test cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'hls-r2-launch-smoke'
          $problems = New-Object System.Collections.Generic.List[string]

          $procs = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($dir, [System.StringComparison]::OrdinalIgnoreCase) })
          foreach ($p in $procs) {
            Write-Host "Stopping $($p.ProcessName) (pid $($p.Id))"
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Wait-Process -Id $p.Id -Timeout 15 -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2

          $uninstaller = Join-Path $dir 'uninstall.exe'
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            Write-Host 'Uninstalling'
            # `_?=` keeps the uninstaller in place so -Wait really waits; last argument, unquoted.
            $u = Start-Process -FilePath $uninstaller -ArgumentList '/S', "_?=$dir" -Wait -PassThru
            if ($u.ExitCode -ne 0) { $problems.Add("uninstaller exited with code $($u.ExitCode)") }
          }

          for ($i = 0; $i -lt 3 -and (Test-Path -LiteralPath $dir); $i++) {
            Remove-Item -Recurse -Force -LiteralPath $dir -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $dir) { Start-Sleep -Seconds 2 }
          }
          if (Test-Path -LiteralPath $dir) { $problems.Add("could not remove $dir") }

          if ($problems.Count -gt 0) {
            foreach ($m in $problems) { Write-Host "::error::$m" }
            exit 1
          }
          Write-Host 'Cleanup done'

      - name: Upload launch smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launch-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/launch-smoke
          retention-days: 7
          if-no-files-found: warn
