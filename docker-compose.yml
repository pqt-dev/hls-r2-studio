services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hls-r2-studio-app
    env_file:
      - .env
    environment:
      FFMPEG_BINARY: ffmpeg
      FFPROBE_BINARY: ffprobe
    volumes:
      - ./.env:/var/www/html/.env
      - storage-data:/var/www/html/storage
      - database-data:/var/www/html/database
      - public-data:/var/www/html/public
    expose:
      - "9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  queue:
    image: hls-r2-studio-app
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=3600"]
    env_file:
      - .env
    environment:
      FFMPEG_BINARY: ffmpeg
      FFPROBE_BINARY: ffprobe
    volumes:
      - storage-data:/var/www/html/storage
      - database-data:/var/www/html/database
      - public-data:/var/www/html/public
    depends_on:
      app:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      replicas: 2

  webserver:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - public-data:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  storage-data:
  database-data:
  public-data:
