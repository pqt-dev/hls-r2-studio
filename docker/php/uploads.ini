; Matches UPLOAD_MAX_SIZE_MB=2048 from .env.example. If you change
; UPLOAD_MAX_SIZE_MB in .env, update the values below to match and rebuild
; the app/queue images (PHP ini values cannot read environment variables).
upload_max_filesize = 2048M
post_max_size = 2048M

; Upload/transcode requests are handled synchronously only up to the point of
; dispatching the queue job (the actual FFmpeg work happens in the queue
; worker), so this only needs to be generous enough for large file uploads.
max_execution_time = 300
max_input_time = 300
